name: US Market Bot (4:30 PM EST)

on:
  schedule:
    # 4:30 PM EST = 21:30 UTC
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  post-us:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas lxml yfinance beautifulsoup4

      - name: Run US Market Bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
        run: python us_market_bot.py
