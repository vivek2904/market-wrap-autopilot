name: US Market Autopilot (5 PM EST)
on:
  schedule:
    - cron: '0 22 * * 1-5' # 10 PM UTC = 5 PM EST (Monday to Friday)
  workflow_dispatch:
jobs:
  run-us-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Libs
         run: pip install requests yfinance pandas lxml beautifulsoup4
      - name: Run US Bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
        run: python us_market_bot.py
