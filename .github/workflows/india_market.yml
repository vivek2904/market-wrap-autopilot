name: India Market Bot (9:43 PM IST)

on:
  schedule:
    # 9:43 PM IST = 16:13 UTC
    - cron: '13 16 * * *'
  workflow_dispatch:

jobs:
  post-india:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas lxml yfinance beautifulsoup4

      - name: Run India Market Bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
        run: python market_bot.py
