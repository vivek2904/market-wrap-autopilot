name: Market Autopilot (5:30 PM IST)
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Libs
        # We switched to nsepython and added curl/openssl for connectivity
        run: pip install requests pandas nsepython lxml
      - name: Run Bot
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          WP_URL: ${{ secrets.WP_URL }}
        run: python market_bot.py
